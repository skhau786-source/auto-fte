[pytest]
# pytest-asyncio 1.x: async tests must be marked with @pytest.mark.asyncio
asyncio_mode = strict
# Session-scoped async fixtures (e.g. setup_database) must run on the
# session event loop. Without this, mixing scopes raises "Event loop is closed"
# errors when PostgreSQL is available. Run async tests on the same session
# loop as well: asyncpg connection pools are bound to the loop they were
# created on, and on Windows a fresh loop per test breaks pooled connections
# with "NoneType' object has no attribute 'send'".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
